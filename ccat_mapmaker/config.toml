# ============================================================
# CCAT Quick-Look Mapmaker -- Configuration File
# ============================================================


# ============================================================================ #
# data
[data]

input_dirs = ["/home/player1/map_making_vlad/sample_h5"]

# "g3", "h5"
file_format = "h5"

# "simulation", "lab"
format = "lab" 


# ============================================================================ #
# map
[map]

# Map centre in celestial coordinates (degrees).
# Priority: ra0_deg/dec0_deg (if both set) > target > auto (mean boresight).
ra0_deg  = 229.663
dec0_deg = -56.649
# 229.663, -56.649: RCW 92's SIMBAD J2000 position (15h18m39.1s, -56d38'49")

# Alternative to manual ra0_deg/dec0_deg: resolve the centre from a name. Ignored while ra0_deg/dec0_deg above are both set, comment those out to use this.
# - Solar-system bodies ("jupiter", "saturn", "moon", "sun", ...) move, so they're looked up via ephemeris at the observation's start time from an observer site so FYST for simulation, or the gondola's own lat/lon/alt telemetry for real BLAST-TNG data (a balloon flight has no fixed site). Useful since planets are used as calibration sources.
# - Anything else is resolved by name via SkyCoord.from_name (SIMBAD, requires network access).

# Map extent
xlen_deg   = 2.5 # deg
ylen_deg   = 1.3 # deg

# Map pixel size
res_arcmin = 0.25 # arcmin

# If true, run an extra boresight-only naive pass and save a side-by-side comparison plot showing the effect of applying focal plane offsets.
compare_boresight = false


# ---------------------------------------------------------------- #
# pipeline
[pipeline]

# ---------------------------------------------------------------- #
#   Chunking & time window

# Time window: skip start_offset_s seconds, then process max_duration_s seconds.
# Comment out max_duration_s to process the full observation.
# Reverted to the full file -- the reference profiling/mapmaker.py script
# runs roach1_pass3.g3 whole, no time-windowing, and relies on a wide enough
# map (see [map] xlen_deg/ylen_deg) rather than hunting for a specific slice.
start_offset_s = 0
#max_duration_s = 0

# Chunk duration in seconds, or "auto" to size chunks from available memory.
# Auto mode targets chunk_memory_fraction of currently available RAM and uses
# chunk_memory_gb as an optional upper bound (0 = no explicit cap).
chunk_duration_s = "auto"
chunk_memory_fraction = 0.5
chunk_memory_gb = 0.0

# Legacy setting; not currently consumed. Use chunk_duration_s = "auto" and
# chunk_memory_* to size processing chunks from available memory.
time_chunk_size = 0

# ---------------------------------------------------------------- #
#   Common-mode & cleaning

# Common-mode subtraction iterations after the naive map.
# 0 = naive map only, 3-5 = good balance of quality vs runtime.
n_iterations = 3

# ---------------------------------------------------------------- #
#   Detector exclusion

# Std away from all detectors median.
# Set to 0 to disable auto-exclusion.
auto_exclude_threshold = 0 

#exclude_detectors = ["roach1_0011", "roach1_0127"]
#exclude_detector_indices = [1, 2]

# Additional automatic exclusion based on each detector's white-noise-floor 
# median PSD in a 0.4-0.9x Nyquist band. 
# Cutoff is log-median + N*sigma of log10(white_noise_floor).
# Set to 0 to disable.
wnf_exclude_sigma = 3.0

# ---------------------------------------------------------------- #
#   Map weighting

# Per-detector map weight = 1/white_noise_floor (inverse-variance), using the
# same whole-observation estimate as wnf_exclude_sigma above -- quieter
# detectors count for more in the combined map. Capped at weight_cap_factor x
# the median weight so one anomalously-quiet detector can't dominate the map;
# detectors with no usable white_noise_floor estimate fall back to the
# median weight. Set to 0 to disable (uniform weighting, every detector
# counts equally).
weight_cap_factor = 5.0

# ---------------------------------------------------------------- #
#   Diagnostics

# Jackknife/null-test maps -- both are diagnostics for checking that
# apparent map features are real signal, not noise, and can be turned off
# independently of each other and of the hits/noise (RMS) maps, which are
# always computed.
# - compute_time_null: even/odd chunk-parity half-difference. Numerically free (reuses the main bin_chunk result); disabling it just skips its .npy/.png output.
# - compute_detsplit_null: random 50/50 detector-identity half-difference. Costs 2 extra bin_chunk calls per chunk -- the one that's actually worth turning off for speed.
compute_time_null     = false
compute_detsplit_null = false

# ---------------------------------------------------------------- #
# pipeline.cosmic_rays
[pipeline.cosmic_rays]
sigma = 3.5 # Spike threshold, in units of sigma*std(tod).
n = 2 # Samples masked on each side of a detected spike.
max_width = 5 # Max spike width to be considered cosmic ray.

# ---------------------------------------------------------------- #
# pipeline.highpass
# [pipeline.highpass]
# cutoff_hz = 0.0

# ---------------------------------------------------------------- #
# pipeline.notch
# [pipeline.notch]
# freq_hz      = 60.0 # 50.0 at FYST
# n_harmonics  = 5 # includes the fundamental as harmonic 1
# bandwidth_hz = 1.0 # width of each notch

# ---------------------------------------------------------------- #
# output
[output]
output_dir = "output"
obs_object = "RCW92"
save_numpy = true
save_png   = false

# ---------------------------------------------------------------- #
# per_detector
[per_detector]
# Per-detector maps for pointing model reconstruction.
# Each detector gets its own map; peak RA/Dec centroid saved to centroids.json.
enabled         = false
save_png        = false
save_numpy      = true
noise_threshold = 3.0 # flag detectors with off-source RMS > threshold * median RMS

apply_offsets   = false # false = bin against shared boresight ra_bore/dec_bore, no per-detector offset applied (offsets not known/trusted yet) centroids.json then records where the boresight was pointing at each detector's peak,

# Detector selection -- choose ONE of the following:
max_detectors = 0 # 0 = all; N = evenly sample N detectors
#detectors = ["PC_f280_A_001"] # specific detectors by name
#detector_indices = [0, 5, 100] # specific detectors by index=